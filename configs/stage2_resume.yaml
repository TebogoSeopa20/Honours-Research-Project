run_name: stage2_ooc_finetune_resume
seed: 42
base_model: llava-hf/llava-1.5-7b-hf
load_in_4bit: true
stage1_adapter: outputs/checkpoints/stage1_best_local  # copy stage1-best-v2 here each session, same as before
stage2_adapter: ""                                     # leave empty — resume_from_adapter below replaces this path
resume_from_adapter: outputs/checkpoints/stage2_resume_base  # copy stage2-best-3ep-manual here each session
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
epochs: 2            # ADDITIONAL epochs to run on top of the resumed adapter, not a new total
batch_size: 4
grad_accum: 4
lr: 5.0e-5            # halved vs the original 1.0e-4 — continuing an already-converging adapter needs smaller steps
warmup_ratio: 0.03
wandb: false
max_samples: null
save_every_steps: 20
kaggle_checkpoint_dataset: tebogoseopa20/stage2-checkpoints-resumed  # fresh name — do not reuse stage2-checkpoints-3ep-manual
